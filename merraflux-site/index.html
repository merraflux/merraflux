<script>
/* ============ COSMIC DUST / GALAXY ============ */
(function(){
  const neb=document.createElement("div");neb.id="nebula";neb.setAttribute("aria-hidden","true");neb.innerHTML="<i class='a'></i><i class='b'></i>";
  const cv=document.createElement("canvas");cv.id="dust";cv.setAttribute("aria-hidden","true");
  document.body.prepend(cv);document.body.prepend(neb);
  const g=cv.getContext("2d"),still=matchMedia("(prefers-reduced-motion: reduce)").matches,R=Math.random,
        COL=["255,255,255","255,190,225","190,170,255","150,210,255"];
  let W,H,P=[],B=[],last=0;
  function size(){
    const D=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
    cv.width=W*D;cv.height=H*D;g.setTransform(D,0,0,D,0,0);
    P=Array.from({length:Math.min(320,Math.max(70,Math.round(W*H/3200)))},()=>({x:R()*W,y:R()*H,r:.3+R()*1.5,a:.15+R()*.45,c:COL[Math.floor(R()*4)],vx:(R()-.5)*10,vy:(R()-.5)*6,p:R()*6.28,s:.4+R()}));
    B=Array.from({length:12},()=>({x:R()*W,y:R()*H,r:90+R()*200,a:.05+R()*.08,c:COL[1+Math.floor(R()*3)],vx:(R()-.5)*8,vy:(R()-.5)*5}));
    if(still)draw(0);
  }
  function draw(t){
    g.clearRect(0,0,W,H);
    B.forEach(b=>{const r=g.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r);r.addColorStop(0,`rgba(${b.c},${b.a})`);r.addColorStop(1,`rgba(${b.c},0)`);g.fillStyle=r;g.fillRect(b.x-b.r,b.y-b.r,b.r*2,b.r*2)});
    P.forEach(d=>{g.fillStyle=`rgba(${d.c},${(d.a*(.6+.4*Math.sin(t/1000*d.s+d.p))).toFixed(3)})`;g.beginPath();g.arc(d.x,d.y,d.r,0,6.283);g.fill()});
  }
  function wrap(o,m){if(o.x<-m)o.x=W+m;if(o.x>W+m)o.x=-m;if(o.y<-m)o.y=H+m;if(o.y>H+m)o.y=-m}
  function frame(t){
    const dt=Math.min((t-last)/1000,.05);last=t;
    P.forEach(d=>{d.x+=d.vx*dt;d.y+=d.vy*dt;wrap(d,10)});
    B.forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt;wrap(b,b.r)});
    draw(t);requestAnimationFrame(frame);
  }
  size();addEventListener("resize",size);
  if(!still)requestAnimationFrame(frame);
})();
</script>
